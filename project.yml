name: GoldfishApple
options:
  bundleIdPrefix: com.goldfish
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"

packages:
  GoldfishCore:
    path: Packages/GoldfishCore

targets:
  GoldfishMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/GoldfishApp
    dependencies:
      - package: GoldfishCore
    info:
      path: Sources/GoldfishApp/Resources/Info-Mac.plist
      properties:
        CFBundleDisplayName: Goldfish
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: ""
        # Version/Build hier verankert, NICHT nur in Info-Mac.plist:
        # `xcodegen generate` setzt CFBundleVersion in der plist-Datei sonst auf
        # "1" zurück (2026-08-28 passiert). Bump-Punkt für den informellen
        # Build-Zähler ist ab jetzt diese Zeile.
        # User-Anfrage 2026-09-02: "ab sofort eine Versionsnummer im Menü ...
        # bei jedem Build um x.1 erhöhen" — ersetzt den bisherigen informellen
        # "Build NNNN"-Zähler (siehe Memory feedback_apple_versioning). Nächster
        # Bump: 0.1 → 0.2 → 0.3 … Sichtbar in Settings → Account → "Version".
        CFBundleShortVersionString: "0.8"
        CFBundleVersion: "181"
    # App Sandbox intentionally OFF (2026-08-19) — see GoldfishMac.entitlements for the
    # full story: Security-Scoped-Bookmarks failed unpredictably even for internal APFS
    # folders under a free "Personal Team" signature, not just exFAT USB-sticks. Goldfish
    # isn't Mac App Store-bound, so sandboxing isn't required. If that changes (Apple TV /
    # App Store distribution raised 2026-08-19), this needs revisiting together with a
    # paid Developer Program membership.
    entitlements:
      path: Sources/GoldfishApp/Resources/GoldfishMac.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldfish.mac
        MARKETING_VERSION: "0.8"
        CURRENT_PROJECT_VERSION: "155"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        # Bezahltes Apple Developer Program-Team (seit 2026-09-03, Bestätigung
        # per Email erhalten) — ersetzt das vorherige kostenlose Personal Team
        # (Y83997R5WL). Fest im Projekt gespeichert, damit `xcodegen generate`
        # die in der Xcode-GUI gewählte Team-ID nicht wegwischt.
        # xcodebuild-CLI kann trotz bezahltem Account weiterhin nicht
        # automatisch signieren (kein Account-Zugriff außerhalb der Xcode-GUI) —
        # der signierte Build läuft über Xcode (⌘R / Product ▸ Archive).
        DEVELOPMENT_TEAM: SYQL3PUXA9
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  GoldfishiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/GoldfishApp
    dependencies:
      - package: GoldfishCore
    info:
      path: Sources/GoldfishApp/Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Goldfish
        # Siehe Kommentar beim GoldfishMac-Target: 0.1 → 0.2 → 0.3 … bei jedem Build.
        CFBundleShortVersionString: "0.8"
        CFBundleVersion: "181"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # com.goldfish.ios war unter dem alten kostenlosen Personal Team
        # reserviert und deshalb für Geräte-Tests auf .iosdev ausgewichen
        # (siehe Git-Historie). Mit dem neuen, bezahlten Team (2026-09-03)
        # ist das ein anderes Konto — .ios sollte wieder frei sein.
        PRODUCT_BUNDLE_IDENTIFIER: com.goldfish.ios
        MARKETING_VERSION: "0.8"
        CURRENT_PROJECT_VERSION: "155"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SYQL3PUXA9  # siehe Kommentar beim GoldfishMac-Target
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  GoldfishMac:
    build:
      targets:
        GoldfishMac: all
    run:
      config: Debug
  GoldfishiOS:
    build:
      targets:
        GoldfishiOS: all
    run:
      config: Debug
