name: GoldfishApple
options:
  bundleIdPrefix: com.goldfish
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"

packages:
  GoldfishCore:
    path: Packages/GoldfishCore

targets:
  GoldfishMac:
    type: application
    platform: macOS
    sources:
      # ffmpeg-bin ausgeschlossen (unten als eigener "folder"-Source erneut
      # eingebunden) -- als normale, von der regulären Ordner-Gruppe
      # mitgescannte Dateien wuerde xcodegen die beiden Binaries als
      # gelbe Gruppe (flach in Contents/Resources/) statt als blaue
      # Ordner-Referenz einbetten, das findFFmpeg()/findFFprobe()-
      # `subdirectory: "ffmpeg-bin"`-Lookup faende sie dann nicht.
      - path: Sources/GoldfishApp
        excludes:
          - "Resources/ffmpeg-bin/**"
      # "type: folder" = blaue Ordner-Referenz -- bewahrt die Unterordner-
      # Struktur beim Kopieren nach Contents/Resources/ffmpeg-bin/*, siehe
      # findFFmpeg()/findFFprobe() in LocalTranscodeService.swift. Nur fuer
      # GoldfishMac (iOS/tvOS bieten keine lokalen Bibliotheken/
      # Formatanpassung, siehe project_todo/CLAUDE.md "iOS als reiner
      # Online-Player" -- unnoetiger Bundle-Groessen-Ballast dort).
      - path: Sources/GoldfishApp/Resources/ffmpeg-bin
        type: folder
        buildPhase: resources
    dependencies:
      - package: GoldfishCore
    info:
      path: Sources/GoldfishApp/Resources/Info-Mac.plist
      properties:
        CFBundleDisplayName: Goldfish
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: ""
        # Version/Build hier verankert, NICHT nur in Info-Mac.plist:
        # `xcodegen generate` setzt CFBundleVersion in der plist-Datei sonst auf
        # "1" zurück (2026-08-28 passiert). Bump-Punkt für den informellen
        # Build-Zähler ist ab jetzt diese Zeile.
        # User-Anfrage 2026-09-02: "ab sofort eine Versionsnummer im Menü ...
        # bei jedem Build um x.1 erhöhen" — ersetzt den bisherigen informellen
        # "Build NNNN"-Zähler (siehe Memory feedback_apple_versioning). Sichtbar
        # in Settings → Account → "Version".
        # User-Vorgabe 2026-09-07: erste echte Mac App Store-Einreichung —
        # analog zum iOS-Sprung (0.9 → 1.0) auf 1.0 gehoben.
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "186"
    # App Sandbox RE-enabled 2026-09-07 (Mac App Store-Einreichung, User-Vorgabe) — siehe
    # GoldfishMac.entitlements für die volle Geschichte (war 2026-08-19 wegen
    # unvorhersehbar fehlschlagender Security-Scoped Bookmarks unter dem damaligen
    # kostenlosen "Personal Team" deaktiviert worden; läuft seit 2026-09-03 unter einem
    # bezahlten Team, zweiter Versuch). LocalLibraryManager.swift/DownloadManager.swift
    # wurden im selben Zug auf `.withSecurityScope`-Bookmarks umgestellt.
    # WICHTIG: die tatsächlichen Werte MÜSSEN hier in `properties:` stehen, nicht nur in
    # der .entitlements-Datei von Hand editiert werden — `xcodegen generate` GENERIERT
    # die Datei am `path` aus genau diesen `properties` und überschreibt dabei jede
    # manuelle Änderung an der Datei selbst (Bug real erlebt 2026-09-07: ein direktes
    # Bearbeiten der .entitlements-Datei wurde vom nächsten `generate` klanglos auf
    # `properties: {}` zurückgesetzt).
    entitlements:
      path: Sources/GoldfishApp/Resources/GoldfishMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    # Eingebettetes ffmpeg/ffprobe (LGPL-only, selbst gebaut 2026-09-07, siehe
    # LocalTranscodeService.swift findFFmpeg()/findFFprobe()) liegt als lose
    # Resource unter Sources/GoldfishApp/Resources/ffmpeg-bin/ und wird von
    # xcodegen automatisch in "Copy Bundle Resources" aufgenommen (kein
    # eigener Extension-Typ noetig). Xcodes automatischer Sign-Schritt
    # signiert NUR den Dependency-Graph (Frameworks/Plugins/XPC), den er
    # kennt -- lose Resource-Binaries werden NICHT automatisch mitsigniert
    # und wuerden Notarisierung/Gatekeeper mit "code object is not signed at
    # all" scheitern lassen. Deshalb hier ein expliziter Nachsignier-Schritt.
    # WICHTIG: `postCompileScripts` laeuft laut Build-Log VOR "Copy Bundle
    # Resources" (direkt nach Compile Sources) -- die Binaries lagen zu dem
    # Zeitpunkt noch gar nicht im Bundle, das `if [ -f ... ]` griff ins
    # Leere (kein Fehler, aber auch kein Signieren; live per Build-Log
    # verifiziert 2026-09-07: CpResource kam erst 600 Zeilen SPAETER).
    # `postbuildScripts` laeuft dagegen NACH allen eingebauten Phasen
    # (inkl. Copy Bundle Resources) und VOR dem automatischen, impliziten
    # App-Sign-Schritt -- das ist die richtige Stelle.
    postbuildScripts:
      - name: "Codesign eingebettetes ffmpeg/ffprobe"
        script: |
          set -e
          BIN_DIR="${CODESIGNING_FOLDER_PATH}/Contents/Resources/ffmpeg-bin"
          for bin in ffmpeg ffprobe; do
            if [ -f "$BIN_DIR/$bin" ]; then
              chmod +x "$BIN_DIR/$bin"
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
                --timestamp=none --options runtime "$BIN_DIR/$bin"
            fi
          done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldfish.mac
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "186"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        # Bezahltes Apple Developer Program-Team (seit 2026-09-03, Bestätigung
        # per Email erhalten) — ersetzt das vorherige kostenlose Personal Team
        # (Y83997R5WL). Fest im Projekt gespeichert, damit `xcodegen generate`
        # die in der Xcode-GUI gewählte Team-ID nicht wegwischt.
        # ✅ Korrigiert 2026-09-07: `xcodebuild archive` + `-exportArchive
        # -exportOptionsPlist {method: app-store-connect, teamID: SYQL3PUXA9,
        # signingStyle: automatic} -allowProvisioningUpdates` signiert die
        # Release-Distribution DOCH vollständig per CLI (verifiziert per
        # `pkgutil --check-signature` — "3rd Party Mac Developer Installer:
        # Christian Bernauer (SYQL3PUXA9)"). Die alte Annahme "nur über Xcode-
        # GUI möglich" galt nur für einen früheren, nicht mehr reproduzierten
        # Versuch — nicht wieder blind auf Xcode-GUI zurückfallen, CLI zuerst
        # probieren.
        DEVELOPMENT_TEAM: SYQL3PUXA9
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  GoldfishiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/GoldfishApp
    dependencies:
      - package: GoldfishCore
    info:
      path: Sources/GoldfishApp/Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Goldfish
        # User-Anfrage 2026-09-05: "Wir haben ja an der iOS App einiges
        # verbessert. Bitte baue Version 1.0" — erster echter
        # Marketing-Versionssprung (vorher 0.1 → 0.9 informell hochgezählt).
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "185"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # com.goldfish.ios ist unter dem alten kostenlosen Personal Team
        # reserviert — Apple-Bundle-IDs sind global eindeutig, das neue
        # bezahlte Team (SYQL3PUXA9) kann sie nicht übernehmen, und die
        # alte Personal-Team-Reservierung ist über developer.apple.com
        # NICHT erreichbar (Personal Teams haben keine eigene Web-Verwaltung,
        # nur Xcode-intern) — verifiziert 2026-09-03. Bleibt deshalb dauerhaft
        # bei .iosdev, bereits sauber unter SYQL3PUXA9 registriert.
        PRODUCT_BUNDLE_IDENTIFIER: com.goldfish.iosdev
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "185"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SYQL3PUXA9  # siehe Kommentar beim GoldfishMac-Target
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  GoldfishTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources/GoldfishApp
    dependencies:
      - package: GoldfishCore
    info:
      path: Sources/GoldfishApp/Resources/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Goldfish
        # User-Anfrage 2026-09-07: erste echte App-Store-Einreichung der
        # Apple-TV-App -- analog zum iOS-Sprung (0.9 -> 1.0) auf 1.0 gehoben.
        # User-Anfrage 2026-09-08: erstes Feature-Update nach der Einreichung
        # (Suche-Tab, Serien-/Staffelansicht, Qualitäts-Overlay+-Auswahl,
        # Tonspur-Fix, Auto-Hide-Timer-Fix) -- auf 1.1 gehoben.
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "5"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldfish.tvos
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SYQL3PUXA9
        GENERATE_INFOPLIST_FILE: NO
        TVOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

schemes:
  GoldfishMac:
    build:
      targets:
        GoldfishMac: all
    run:
      config: Debug
  GoldfishiOS:
    build:
      targets:
        GoldfishiOS: all
    run:
      config: Debug
  GoldfishTV:
    build:
      targets:
        GoldfishTV: all
    run:
      config: Debug
